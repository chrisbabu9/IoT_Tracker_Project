name: trackpoint
description: TrackPoint app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  firebase_messaging: ^15.1.3

  # State management
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.1

  # Local storage
  shared_preferences: ^2.3.2

  #Maps & location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1

  # BLE
  flutter_blue_plus: ^1.32.12

  # Charts
  fl_chart: ^0.69.0

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Permissions & utilities
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  intl: ^0.19.0

  # Common helpers (add more later if your code needs them)
  cupertino_icons: ^1.0.8

  path_provider: ^2.1.4
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#9500FF"
  image: "assets/icon/app_icon.png"
  android: true
  ios: true
